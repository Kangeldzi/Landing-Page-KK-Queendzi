<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Kelas 5</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --bg-light: #F3F4F6;
      --text-dark: #1F2937;
      --border: #E5E7EB;
      --danger: #EF4444;
      --success: #10B981;
      --font: 'Quicksand', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
    body { background: var(--bg-light); color: var(--text-dark); }
    
    /* Login Screen */
    #loginScreen { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
    .login-box { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .login-box h2 { color: var(--primary-dark); margin-bottom: 1rem; }
    .login-box input { width: 100%; padding: 0.8rem; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 1rem; font-size: 1rem; font-family: var(--font); }
    .login-box button { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .login-box button:hover { background: var(--primary-dark); }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none; }

    /* Dashboard & Header Perbaikan */
    #dashboard { display: none; padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
    
    .header { 
      display: flex; 
      flex-direction: column; 
      gap: 1rem; 
      margin-bottom: 2rem; 
      background: white;
      padding: 1.2rem;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .header-title h1 { color: var(--primary-dark); font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; }
    .header-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; width: 100%; }
    
    .btn { 
      padding: 0.6rem 1rem; 
      border-radius: 10px; 
      border: none; 
      font-weight: 700; 
      font-size: 0.85rem; 
      cursor: pointer; 
      transition: 0.2s; 
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      flex: 1 1 auto; 
      min-width: 120px; 
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { opacity: 0.8; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.8; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-outline:hover { background: var(--primary); color: white; }

    /* Desktop Header */
    @media (min-width: 768px) {
      .header { flex-direction: row; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; }
      .header-actions { width: auto; flex-wrap: nowrap; }
      .btn { flex: 0 1 auto; font-size: 0.9rem; padding: 0.7rem 1.2rem; }
    }

    .card { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
    .card h3 { color: var(--primary-dark); margin-bottom: 1rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-family: var(--font); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    
    .member-item { background: var(--bg-light); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid var(--border); }
    .member-item .grid-2 { gap: 0.5rem; }
    .member-item h4 { font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--primary); }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 10000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>🔐 Login Admin</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-bottom:1rem;">Masukkan password untuk mengakses dashboard.</p>
      <div class="error-msg" id="loginError">Password salah! Silakan coba lagi.</div>
      <input type="password" id="passwordInput" placeholder="Password (default: admin123)">
      <button onclick="checkLogin()">Masuk</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    
    <div class="header">
      <div class="header-title">
        <h1>⚙️ Dashboard Admin</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportCSV()">📥 Ekspor CSV</button>
        <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📤 Impor CSV</button>
        <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn btn-danger" onclick="logout()">🚪 Keluar</button>
      </div>
    </div>

    <div class="card">
      <h3>🏫 Identitas Sekolah & Kelompok</h3>
      <div class="grid-2">
        <div class="form-group"><label>Nama Sekolah</label><input type="text" id="schoolName"></div>
        <div class="form-group"><label>Kelas</label><input type="text" id="className"></div>
        <div class="form-group"><label>Tahun Pelajaran</label><input type="text" id="year"></div>
        <div class="form-group"><label>Nama Kelompok</label><input type="text" id="groupName"></div>
        <div class="form-group"><label>Ikon Logo (Emoji)</label><input type="text" id="logo" maxlength="4"></div>
        <div class="form-group"><label>Guru Pembimbing</label><input type="text" id="teacher"></div>
      </div>
      <div class="form-group"><label>Deskripsi Kelompok (Bio)</label><textarea id="description"></textarea></div>
      <div class="form-group"><label>Topik Tugas Utama</label><input type="text" id="subject"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
        <h3 style="margin-bottom:0; border:none; padding:0;">👥 Data Siswa</h3>
        <button class="btn btn-primary" onclick="addMember()" style="font-size:0.8rem; padding:0.4rem 0.8rem; min-width:auto;">+ Tambah</button>
      </div>
      <div id="membersContainer"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
        <h3 style="margin-bottom:0; border:none; padding:0;">📋 Pembagian Tugas</h3>
        <button class="btn btn-primary" onclick="addTask()" style="font-size:0.8rem; padding:0.4rem 0.8rem; min-width:auto;">+ Tambah</button>
      </div>
      <div id="tasksContainer"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
        <h3 style="margin-bottom:0; border:none; padding:0;">🖼️ Galeri Kegiatan</h3>
        <button class="btn btn-primary" onclick="addGallery()" style="font-size:0.8rem; padding:0.4rem 0.8rem; min-width:auto;">+ Tambah</button>
      </div>
      <div id="galleryContainer"></div>
    </div>

    <div class="card">
      <h3>🚀 Hasil Proyek</h3>
      <div class="grid-2">
        <div class="form-group"><label>Judul Proyek</label><input type="text" id="projTitle"></div>
        <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="projSubject"></div>
        <div class="form-group"><label>Tanggal Selesai</label><input type="text" id="projDate"></div>
      </div>
      <div class="form-group"><label>Deskripsi Proyek</label><textarea id="projDesc"></textarea></div>
    </div>

    <button class="btn btn-success" style="width:100%; padding:1.2rem; font-size:1.1rem; margin-bottom:2rem;" onclick="saveData()">💾 SIMPAN SEMUA DATA KE LOCALSTORAGE</button>
  </div>

  <div class="toast" id="toast">Data berhasil disimpan!</div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    let appData = {};

    function checkLogin() {
      const pass = $('#passwordInput').value;
      if (pass === 'admin123') {
        localStorage.setItem('admin_logged_in', 'true');
        $('#loginScreen').style.display = 'none';
        $('#dashboard').style.display = 'block';
        loadData();
      } else {
        $('#loginError').style.display = 'block';
      }
    }
    function logout() { localStorage.removeItem('admin_logged_in'); location.reload(); }

    function loadData() {
      const saved = localStorage.getItem('kelas5_data');
      if (saved) {
        appData = JSON.parse(saved);
      } else {
        appData = {
          schoolName: 'SDN Negeri Situ Udik', className: 'Kelas 5', year: '2026/2027', groupName: 'Kelompok Belajar Kelas 5', logo: '🎓', teacher: 'Belum diisi', subject: 'Belum diisi',
          description: 'Kami adalah kelompok belajar yang terdiri dari 7 siswa-siswi kelas 5 SDN Negeri Situ Udik. Kami belajar bersama, saling membantu, dan selalu kompak.',
          members: [
            { id: 1, name: 'Joyce', className: 'Kelas 5', role: 'Ketua Kelompok', photo: '🎀', responsibilities: 'Memimpin diskusi.', interests: 'Membaca', description: 'Ramah dan bertanggung jawab.' },
            { id: 2, name: 'Alex', className: 'Kelas 5', role: 'Wakil Ketua', photo: '🧢', responsibilities: 'Membantu ketua.', interests: 'Menggambar', description: 'Kreatif.' },
            { id: 3, name: 'Maya', className: 'Kelas 5', role: 'Sekretaris', photo: '👩', responsibilities: 'Mencatat.', interests: 'Menulis', description: 'Teliti.' },
            { id: 4, name: 'Leo', className: 'Kelas 5', role: 'Penanggung Jawab Materi', photo: '🎧', responsibilities: 'Materi.', interests: 'Sains', description: 'Suka belajar.' },
            { id: 5, name: 'Alice', className: 'Kelas 5', role: 'Penanggung Jawab Ilustrasi', photo: '👱‍♀️', responsibilities: 'Desain.', interests: 'Mewarnai', description: 'Imajinatif.' },
            { id: 6, name: 'Dani', className: 'Kelas 5', role: 'Penanggung Jawab Presentasi', photo: '🧢', responsibilities: 'Presentasi.', interests: 'Berbicara', description: 'Percaya diri.' },
            { id: 7, name: 'Moana', className: 'Kelas 5', role: 'Penanggung Jawab Dokumentasi', photo: '👧', responsibilities: 'Dokumentasi.', interests: 'Fotografi', description: 'Suka foto.' }
          ],
          tasks: [
            { id: 1, title: 'Menentukan Topik', owner: 'Ketua', desc: 'Tema proyek', status: 'selesai', progress: 100 },
            { id: 2, title: 'Cari Bahan', owner: 'Materi', desc: 'Referensi', status: 'proses', progress: 60 }
          ],
          gallery: [
            { emoji: '📚', caption: 'Belajar bersama', image: '' },
            { emoji: '💬', caption: 'Diskusi', image: '' }
          ],
          project: { title: 'Proyek Kelompok', subject: 'Belum diisi', desc: 'Deskripsi proyek.', date: 'Belum diisi' }
        };
      }
      populateForm();
    }

    function populateForm() {
      $('#schoolName').value = appData.schoolName;
      $('#className').value = appData.className;
      $('#year').value = appData.year;
      $('#groupName').value = appData.groupName;
      $('#logo').value = appData.logo;
      $('#teacher').value = appData.teacher;
      $('#description').value = appData.description;
      $('#subject').value = appData.subject;

      $('#projTitle').value = appData.project.title;
      $('#projSubject').value = appData.project.subject;
      $('#projDate').value = appData.project.date;
      $('#projDesc').value = appData.project.desc;

      renderMembersAdmin();
      renderTasksAdmin();
      renderGalleryAdmin();
    }

    function renderMembersAdmin() {
      const container = $('#membersContainer');
      container.innerHTML = '';
      appData.members.forEach((m, index) => {
        const div = document.createElement('div');
        div.className = 'member-item';
        div.innerHTML = `
          <h4>Anggota ${index + 1}</h4>
          <div class="grid-2">
            <div class="form-group"><label>Nama</label><input type="text" value="${m.name}" onchange="updateMember(${m.id}, 'name', this.value)"></div>
            <div class="form-group"><label>Peran / Jabatan</label><input type="text" value="${m.role}" onchange="updateMember(${m.id}, 'role', this.value)"></div>
            <div class="form-group"><label>Kelas</label><input type="text" value="${m.className}" onchange="updateMember(${m.id}, 'className', this.value)"></div>
            <div class="form-group"><label>Emoji / URL Foto</label><input type="text" value="${m.photo || ''}" placeholder="Contoh: 🎀 atau https://..." onchange="updateMember(${m.id}, 'photo', this.value)"></div>
            <div class="form-group"><label>Hobi / Minat</label><input type="text" value="${m.interests || ''}" onchange="updateMember(${m.id}, 'interests', this.value)"></div>
            <div class="form-group"><label>Deskripsi Singkat</label><input type="text" value="${m.description}" onchange="updateMember(${m.id}, 'description', this.value)"></div>
          </div>
          <div class="form-group"><label>Tanggung Jawab</label><input type="text" value="${m.responsibilities}" onchange="updateMember(${m.id}, 'responsibilities', this.value)"></div>
          <button class="btn btn-danger" style="font-size:0.75rem;padding:0.4rem 0.8rem; min-width:auto;" onclick="removeMember(${m.id})">Hapus Anggota</button>
        `;
        container.appendChild(div);
      });
    }

    function updateMember(id, field, val) {
      const m = appData.members.find(x => x.id === id);
      if (m) m[field] = val;
    }
    function addMember() {
      const newId = appData.members.length > 0 ? Math.max(...appData.members.map(m => m.id)) + 1 : 1;
      appData.members.push({ id: newId, name: 'Siswa Baru', className: appData.className, role: 'Anggota', photo: '👤', responsibilities: '-', interests: '-', description: '-' });
      renderMembersAdmin();
    }
    function removeMember(id) {
      if(confirm('Hapus anggota ini?')) {
        appData.members = appData.members.filter(m => m.id !== id);
        renderMembersAdmin();
      }
    }

    function renderTasksAdmin() {
      const container = $('#tasksContainer');
      container.innerHTML = '';
      appData.tasks.forEach(t => {
        const div = document.createElement('div');
        div.className = 'member-item';
        div.innerHTML = `
          <div class="grid-2">
            <div class="form-group"><label>Nama Tugas</label><input type="text" value="${t.title}" onchange="updateTask(${t.id}, 'title', this.value)"></div>
            <div class="form-group"><label>Penanggung Jawab</label><input type="text" value="${t.owner}" onchange="updateTask(${t.id}, 'owner', this.value)"></div>
            <div class="form-group"><label>Deskripsi</label><input type="text" value="${t.desc}" onchange="updateTask(${t.id}, 'desc', this.value)"></div>
            <div class="form-group"><label>Status</label>
              <select onchange="updateTask(${t.id}, 'status', this.value)">
                <option value="belum" ${t.status==='belum'?'selected':''}>Belum Dimulai</option>
                <option value="proses" ${t.status==='proses'?'selected':''}>Sedang Dikerjakan</option>
                <option value="selesai" ${t.status==='selesai'?'selected':''}>Selesai</option>
              </select>
            </div>
            <div class="form-group"><label>Progress (0-100)</label><input type="number" value="${t.progress}" min="0" max="100" onchange="updateTask(${t.id}, 'progress', parseInt(this.value))"></div>
          </div>
          <button class="btn btn-danger" style="font-size:0.75rem;padding:0.4rem 0.8rem; min-width:auto;" onclick="removeTask(${t.id})">Hapus Tugas</button>
        `;
        container.appendChild(div);
      });
    }
    function updateTask(id, field, val) {
      const t = appData.tasks.find(x => x.id === id);
      if (t) t[field] = val;
    }
    function addTask() {
      const newId = appData.tasks.length > 0 ? Math.max(...appData.tasks.map(t => t.id)) + 1 : 1;
      appData.tasks.push({ id: newId, title: 'Tugas Baru', owner: 'Anggota', desc: '-', status: 'belum', progress: 0 });
      renderTasksAdmin();
    }
    function removeTask(id) {
      if(confirm('Hapus tugas ini?')) {
        appData.tasks = appData.tasks.filter(t => t.id !== id);
        renderTasksAdmin();
      }
    }

    function renderGalleryAdmin() {
      const container = $('#galleryContainer');
      container.innerHTML = '';
      appData.gallery.forEach((g, index) => {
        const div = document.createElement('div');
        div.className = 'member-item';
        div.innerHTML = `
          <div class="grid-2">
            <div class="form-group"><label>Emoji (Jika tanpa gambar)</label><input type="text" value="${g.emoji || ''}" onchange="updateGallery(${index}, 'emoji', this.value)"></div>
            <div class="form-group"><label>Caption / Keterangan</label><input type="text" value="${g.caption}" onchange="updateGallery(${index}, 'caption', this.value)"></div>
          </div>
          <div class="form-group"><label>URL Gambar (Opsional)</label><input type="text" value="${g.image || ''}" placeholder="https://..." onchange="updateGallery(${index}, 'image', this.value)"></div>
          <button class="btn btn-danger" style="font-size:0.75rem;padding:0.4rem 0.8rem; min-width:auto;" onclick="removeGallery(${index})">Hapus Galeri</button>
        `;
        container.appendChild(div);
      });
    }
    function updateGallery(index, field, val) {
      appData.gallery[index][field] = val;
    }
    function addGallery() {
      appData.gallery.push({ emoji: '🖼️', caption: 'Kegiatan Baru', image: '' });
      renderGalleryAdmin();
    }
    function removeGallery(index) {
      if(confirm('Hapus galeri ini?')) {
        appData.gallery.splice(index, 1);
        renderGalleryAdmin();
      }
    }

    function saveData() {
      appData.schoolName = $('#schoolName').value;
      appData.className = $('#className').value;
      appData.year = $('#year').value;
      appData.groupName = $('#groupName').value;
      appData.logo = $('#logo').value;
      appData.teacher = $('#teacher').value;
      appData.description = $('#description').value;
      appData.subject = $('#subject').value;

      appData.project.title = $('#projTitle').value;
      appData.project.subject = $('#projSubject').value;
      appData.project.date = $('#projDate').value;
      appData.project.desc = $('#projDesc').value;

      localStorage.setItem('kelas5_data', JSON.stringify(appData));
      
      const toast = $('#toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // === FITUR EXPORT / IMPORT CSV ===
    function exportCSV() {
      saveData(); // Simpan dulu ke LocalStorage agar data paling update terunduh
      
      let csv = "data:text/csv;charset=utf-8,";
      csv += "IDENTITAS SEKOLAH\n";
      csv += `Nama Sekolah,${appData.schoolName}\nKelas,${appData.className}\nTahun,${appData.year}\nKelompok,${appData.groupName}\nGuru Pembimbing,${appData.teacher}\nTopik,${appData.subject}\nDeskripsi,"${appData.description}"\n\n`;
      
      csv += "DATA SISWA\nID,Nama,Peran,Kelas,Foto/Hobi,Deskripsi,Tanggung Jawab\n";
      appData.members.forEach(m => {
        csv += `${m.id},"${m.name}","${m.role}","${m.className}","${m.photo}","${m.description}","${m.responsibilities}"\n`;
      });
      csv += "\nDATA TUGAS\nID,Judul,Penanggung Jawab,Deskripsi,Status,Progress\n";
      appData.tasks.forEach(t => {
        csv += `${t.id},"${t.title}","${t.owner}","${t.desc}","${t.status}",${t.progress}\n`;
      });
      
      const encodedUri = encodeURI(csv);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "data_kelas5.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        
        // Parser CSV Sederhana (Membaca format hasil ekspor kita)
        const lines = text.split('\n');
        const newData = JSON.parse(JSON.stringify(appData)); // Copy struktur data saat ini
        
        let currentSection = "";
        let newMembers = [];
        let newTasks = [];

        lines.forEach(line => {
          const parts = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
          if (!parts) return;
          
          if (line.startsWith('Nama Sekolah')) newData.schoolName = parts[1].replace(/^"|"$/g, '');
          else if (line.startsWith('Kelas')) newData.className = parts[1].replace(/^"|"$/g, '');
          else if (line.startsWith('Tahun')) newData.year = parts[1].replace(/^"|"$/g, '');
          else if (line.startsWith('Kelompok')) newData.groupName = parts[1].replace(/^"|"$/g, '');
          else if (line.startsWith('Deskripsi')) {
              const descParts = line.substring(line.indexOf(',') + 1).replace(/^"|"$/g, '');
              newData.description = descParts;
          }
          else if (line.startsWith('ID,Nama,Peran')) currentSection = 'SISWA';
          else if (line.startsWith('ID,Judul')) currentSection = 'TUGAS';
          else if (line.trim() === '') currentSection = '';
          else if (currentSection === 'SISWA' && parts.length >= 7) {
              newMembers.push({
                  id: parseInt(parts[0]),
                  name: parts[1].replace(/^"|"$/g, ''),
                  role: parts[2].replace(/^"|"$/g, ''),
                  className: parts[3].replace(/^"|"$/g, ''),
                  photo: parts[4].replace(/^"|"$/g, ''),
                  description: parts[5].replace(/^"|"$/g, ''),
                  responsibilities: parts[6].replace(/^"|"$/g, ''),
                  interests: '-'
              });
          }
          else if (currentSection === 'TUGAS' && parts.length >= 6) {
              newTasks.push({
                  id: parseInt(parts[0]),
                  title: parts[1].replace(/^"|"$/g, ''),
                  owner: parts[2].replace(/^"|"$/g, ''),
                  desc: parts[3].replace(/^"|"$/g, ''),
                  status: parts[4].replace(/^"|"$/g, ''),
                  progress: parseInt(parts[5])
              });
          }
        });

        if (newMembers.length > 0) newData.members = newMembers;
        if (newTasks.length > 0) newData.tasks = newTasks;
        
        appData = newData;
        populateForm();
        saveData(); // Simpan otomatis setelah impor
        alert('Data berhasil diimpor dari CSV!');
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    if(localStorage.getItem('admin_logged_in') === 'true') {
      $('#loginScreen').style.display = 'none';
      $('#dashboard').style.display = 'block';
      loadData();
    }
  </script>
</body>
</html>
